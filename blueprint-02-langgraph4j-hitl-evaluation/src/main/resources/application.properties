spring.application.name=blueprint-02-langgraph4j-hitl-evaluation
spring.threads.virtual.enabled=true
server.port=${PORT:8082}
blueprints.model=${BLUEPRINTS_MODEL:stub}
blueprints.hitl.max-revisions=2
# Blueprint 2 submission review graph (/api/v1/workflows)
# mock = deterministic keyword evaluator (default); ollama = the ChatModel bean (build with -Pit, BLUEPRINTS_MODEL=ollama)
llm.provider=${LLM_PROVIDER:mock}
spring.ai.model.chat=${blueprints.model}
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
# memory (dev) or jdbc (durable; set SPRING_DATASOURCE_URL to PostgreSQL in production)
blueprints.hitl.checkpoint=${HITL_CHECKPOINT:memory}
blueprints.hitl.node-timeout=${HITL_NODE_TIMEOUT:PT60S}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hitl;DB_CLOSE_DELAY=-1}
