spring.application.name=blueprint-07-a2a-nl2sql-agent
spring.threads.virtual.enabled=true
server.port=${PORT:8087}
blueprints.model=${BLUEPRINTS_MODEL:stub}
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.sql.init.mode=always
blueprints.nl2sql.max-rows=500
blueprints.nl2sql.max-retries=3
