spring.application.name=blueprint-01-goap-finops-incident-agent
spring.threads.virtual.enabled=true
server.port=${PORT:8081}
blueprints.model=${BLUEPRINTS_MODEL:stub}
# spike = today's cost > baseline x factor
blueprints.goap.anomaly-factor=1.5
# runaway jobs whose excess spend is at most this are stopped without a human
blueprints.goap.auto-approve-limit-inr=10000
# Blueprint 1 (handbook): model names per role when blueprints.model is not stub, e.g. qwen2.5-coder:7b and llama3.2
blueprints.goap.fast-model=${GOAP_FAST_MODEL:}
blueprints.goap.frontier-model=${GOAP_FRONTIER_MODEL:}
# Spring Shell stays off unless the "shell" profile is active
spring.shell.interactive.enabled=false
# ...and its runner is not even loaded, so plain program arguments are never parsed as shell commands
spring.autoconfigure.exclude=org.springframework.shell.core.autoconfigure.SpringShellAutoConfiguration
