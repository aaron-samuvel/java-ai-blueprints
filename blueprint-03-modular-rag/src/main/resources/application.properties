spring.application.name=blueprint-03-modular-rag
spring.threads.virtual.enabled=true
server.port=${PORT:8083}
blueprints.model=${BLUEPRINTS_MODEL:stub}
blueprints.rag.top-k=3
# Tuned for the stub bag-of-words embeddings; nomic-embed-text typically needs a higher value (~0.5).
blueprints.rag.similarity-threshold=${RAG_THRESHOLD:0.2}
blueprints.rag.ingest-on-startup=true
# Handbook pipeline (/api/v1/rag/*). Empty threshold = 0.76 with real embeddings, 0.25 with the stub embeddings.
blueprints.rag.handbook.similarity-threshold=${RAG_HANDBOOK_THRESHOLD:}
blueprints.rag.handbook.max-documents=4
blueprints.rag.handbook.enrich=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Actuator: /actuator/health/aiEnvironment and /actuator/metrics/rag.vector.search
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
