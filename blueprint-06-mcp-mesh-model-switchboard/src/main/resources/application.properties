spring.application.name=blueprint-06-mcp-mesh-model-switchboard
spring.threads.virtual.enabled=true
server.port=${PORT:8086}
blueprints.mcp.toolset=${MCP_TOOLSET:billing}
spring.ai.mcp.server.name=java-ai-blueprints-${blueprints.mcp.toolset}
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
