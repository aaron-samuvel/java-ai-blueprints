spring.application.name=blueprint-06-mcp-mesh-model-switchboard
spring.threads.virtual.enabled=true
server.port=${PORT:8086}
blueprints.mcp.toolset=${MCP_TOOLSET:billing}
spring.ai.mcp.server.name=java-ai-blueprints-${blueprints.mcp.toolset}
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
# JWT validation: set ONE of these via environment variables (never commit values)
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://your-idp/realms/x
#   BLUEPRINTS_DEV_JWT_SECRET=<at least 32 random characters, local dev only>
# Maps the documented env var onto the property the dev decoder reads (relaxed binding alone would
# expect BLUEPRINTS_SECURITY_DEVJWTSECRET). Empty when unset, which leaves the dev decoder off.
blueprints.security.dev-jwt-secret=${BLUEPRINTS_DEV_JWT_SECRET:}
# --- Handbook additions ---
# MCP_TOOLSET=ops turns this node into the mcp-ops-server (Batch introspection, JVM diagnostics, OpenAPI bridge).
spring.ai.mcp.server.tool-change-notification=true
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.datasource.url=jdbc:h2:mem:ops;DB_CLOSE_DELAY=-1
blueprints.ops.batch.restartable-jobs=ledgerReconciliationJob
blueprints.ops.batch.max-restarts=3
blueprints.ops.jfr.pinned-threshold=20ms
# Switchboard router (author's thresholds)
blueprints.switchboard.cloud-timeout=5s
blueprints.switchboard.fast-budget=1500ms
blueprints.switchboard.frontier-threshold=0.5
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
