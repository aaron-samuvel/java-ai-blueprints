spring.application.name=blueprint-05-pii-tokenization-advisor
spring.threads.virtual.enabled=true
server.port=${PORT:8085}
# stub = offline echo model (default). Set BLUEPRINTS_MODEL=ollama and build with -Pit to use Ollama.
blueprints.model=${BLUEPRINTS_MODEL:stub}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
# Only activate Spring AI's Ollama chat auto-config when blueprints.model=ollama (avoids two ChatModel beans under -Pit).
spring.ai.model.chat=${blueprints.model}
spring.ai.model.embedding=none
# Handbook guardrails (guardrails package)
# Placeholders are restored in final answers only for callers holding this authority.
blueprints.privacy.detokenize-authority=ROLE_PII_VIEWER
# Optional OpenNLP statistical NER models (TokenNameFinderModel files); gazetteers are used either way.
blueprints.privacy.opennlp.person-model=${OPENNLP_PERSON_MODEL:}
blueprints.privacy.opennlp.location-model=${OPENNLP_LOCATION_MODEL:}
# Presidio analyzer joins the composite when set (docker-compose.ai-support.yml exposes it on 5002).
blueprints.environment.presidio-url=${PRESIDIO_ANALYZER_URL:}
blueprints.privacy.presidio.min-score=0.5
blueprints.privacy.presidio.fail-closed=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
