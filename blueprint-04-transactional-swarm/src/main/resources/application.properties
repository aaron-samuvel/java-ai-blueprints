spring.application.name=blueprint-04-transactional-swarm
spring.threads.virtual.enabled=true
server.port=${PORT:8084}
blueprints.model=${BLUEPRINTS_MODEL:stub}
spring.datasource.url=jdbc:h2:mem:swarm;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.sql.init.mode=always
blueprints.swarm.max-refund-inr=5000
# Blueprint 4 handbook swarm (/api/v1/swarm)
blueprints.swarm.memory.max-messages=12
blueprints.swarm.memory.keep-recent=6
blueprints.swarm.refund-window-days=30
